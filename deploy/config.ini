; cm_agent 运行配置模板 —— 安装到 computer_manager.exe 同目录后由 cm_agent.exe 读取。
; 已存在同名文件时构建不会覆盖（运维改过的真实配置优先）。
;
; 请按 UTF-8 保存本文件：中文 Windows 的记事本默认按 ANSI(GBK) 存盘，键名与域名这些
; ASCII 内容仍能读出来（解码容忍坏字节），但 [compat] 里写的中文应用名会变成乱码。
;
; 合规：本仓库不收录任何真实网关域名，baseHost 由部署方按自己的后端填写。
; 未配置时 cm_agent 使用内置占位地址并照常轮询（只会记录请求失败日志）。
[config]
env = prod
baseHost = https://your-backend-gateway.example.com
channel = windows
autoUpgrade = 0

; GUI 的「应用兼容性」检查用（参考实现对应 AppCompatibility_window）。
; 逗号/分号分隔，按注册表 DisplayName 做大小写不敏感的子串匹配，命中即弹窗建议卸载。
; 留空 = 没有判定标准 = 这一项不检查，界面上也不会说「已安装应用兼容云电脑环境」。
; 参考实现那份清单来自运营方后端，规格清单里没有任何一份能证明谁不兼容，
; 所以本仓库不预置任何应用名，由部署方按自己的环境填。
[compat]
incompatible =
