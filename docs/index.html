# PC Manager

Windows 桌面系统管理工具 — Flutter + Rust (flutter_rust_bridge v2)。

- 实时监控仪表盘、进程/启动项管理、应用中心
- winapp2 规则驱动的深度清理、大文件 / 重复文件扫描
- 网速测试、补丁检测、资源悬浮窗、托盘常驻
- 常驻采集 Agent + Windows 保活服务

构建：`flutter build windows --release`（自动集成 Rust 组件）
