<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="PC Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1526"/>
      <stop offset="1" stop-color="#16324f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="280" rx="18" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#7dd3fc" stroke-width="1">
    <path d="M0 70 H960 M0 140 H960 M0 210 H960"/>
    <path d="M120 0 V280 M320 0 V280 M520 0 V280 M720 0 V280 M920 0 V280"/>
  </g>

  <!-- shield mark -->
  <g transform="translate(150,58)" filter="url(#soft)">
    <rect x="0" y="0" width="150" height="150" rx="28" fill="url(#shield)"/>
    <path d="M75 18 L118 34 V78 C118 104 99 122 75 132 C51 122 32 104 32 78 V34 Z"
          fill="#fff" opacity="0.95"/>
    <path d="M56 76 L70 90 L96 62" stroke="#22c55e" stroke-width="11"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <text x="340" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="64"
        font-weight="700" fill="#f8fafc" letter-spacing="1">PC Manager</text>
  <text x="343" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="21"
        fill="#93c5fd">Windows 桌面系统管理工具 · Flutter + Rust</text>

  <!-- chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <rect x="343" y="186" width="86" height="32" rx="16" fill="#0ea5e9" opacity="0.9"/>
    <text x="386" y="207" fill="#082f49" text-anchor="middle" font-weight="600">Flutter</text>
    <rect x="439" y="186" width="72" height="32" rx="16" fill="#f97316" opacity="0.92"/>
    <text x="475" y="207" fill="#431407" text-anchor="middle" font-weight="600">Rust</text>
    <rect x="521" y="186" width="96" height="32" rx="16" fill="#22c55e" opacity="0.9"/>
    <text x="569" y="207" fill="#052e16" text-anchor="middle" font-weight="600">Windows</text>
    <rect x="627" y="186" width="72" height="32" rx="16" fill="#a78bfa" opacity="0.9"/>
    <text x="663" y="207" fill="#2e1065" text-anchor="middle" font-weight="600">MIT</text>
  </g>

  <rect x="120" y="242" width="720" height="4" rx="2" fill="url(#accent)" opacity="0.85"/>
</svg>
