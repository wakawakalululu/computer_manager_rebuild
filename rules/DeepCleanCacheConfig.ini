# PC Manager 深度清理规则示例（winapp2 格式，自写样例）
# 引擎：rust/src/winapp2.rs —— 语法详见仓库 Wiki · Cleaning-Rules
# 部署：随 GUI exe 同目录 rules\ 放置；可整体替换为社区规则库
#       https://github.com/MoscaDotTo/Winapp2 (CC-BY-SA-4.0)

[Windows 临时日志]
LangSecRef=3021
Description=Windows 临时目录中的日志与临时文件。
FileKey1=%WinDir%\Temp|*.log;*.tmp|RECURSE

[系统交付优化日志]
LangSecRef=3021
Description=系统组件交付与安装过程中遗留的日志文件。
FileKey2=%WinDir%\SoftwareDistribution\Download|*.log|RECURSE
