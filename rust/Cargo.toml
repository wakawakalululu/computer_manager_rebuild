[package]
name = "rust_lib"
version = "0.1.0"
edition = "2021"

# 与参考实现一致：Windows 下产出 rust_lib.dll（flutter_rust_bridge 加载）
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# 常驻后台组件（对应原 cloud_computer_manager_agent.exe / keep_alive 服务）
[[bin]]
name = "cm_agent"
path = "src/bin/agent.rs"

[[bin]]
name = "cm_keep_alive"
path = "src/bin/keep_alive.rs"

[dependencies]
flutter_rust_bridge = "=2.9.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

# 系统信息（对应 api::sysinfo：CPU/内存/磁盘/进程/网络）
sysinfo = "0.32"

# 磁盘扫描（对应 api::disk_scan）
walkdir = "2"
rayon = "1"
sha2 = "0.10"
md-5 = "0.10"
zip = "2"

# Windows 系统层（注册表/WMI/Shell/服务）
winreg = "0.52"
wmi = "0.15"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Com",
  # keep_alive 交互会话注入：WTS* 取用户令牌 / 用户环境块
  "Win32_System_RemoteDesktop",
  "Win32_System_Environment",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
] }
windows-service = "0.7"

# Agent 网络层（任务轮询/采集上报）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
